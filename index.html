<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-color=1.0, user-scalable=no">
    <title>精釀啤酒專業考核系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffb703;
            --text-color: #f8f9fa;
            --text-muted: #b3b3b3;
            --highlight-bg: rgba(255, 183, 3, 0.2);
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        header h1 { font-size: 22px; color: var(--accent-color); font-weight: 700; letter-spacing: 1px; }
        
        .filter-panel { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 2; background: #333; border: none; color: white; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: var(--accent-color); color: #121212; }
        .fav-filter-btn { flex: 1; background: #222; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .fav-filter-btn.active { background: #e63946; }

        .control-panel { background: #181818; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .btn-group { display: flex; gap: 8px; flex: 1; }
        button.action-btn { flex: 1; background: #444; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button.action-btn.go { background: #2a9d8f; }
        button.action-btn.primary { background: #e63946; }
        
        .slider-group { display: flex; flex-direction: column; gap: 8px; background: #222; padding: 10px; border-radius: 8px; border: 1px solid #282828; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
        .slider-row input[type="range"] { flex: 1; margin-left: 10px; accent-color: var(--accent-color); cursor: pointer; }

        .settings-group { display: flex; flex-wrap: wrap; gap: 15px; color: var(--text-muted); font-size: 13px; width: 100%; justify-content: space-between; border-top: 1px solid #282828; padding-top: 10px; }
        .settings-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        
        .beer-list { max-height: 55vh; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px; background: #161616; padding: 5px 0; position: relative; }
        .beer-item { display: grid; grid-template-columns: 40px 40px 1.2fr 1fr; padding: 14px 10px; border-bottom: 1px solid var(--border-color); align-items: center; font-size: 14px; cursor: pointer; }
        .beer-item:last-child { border-bottom: none; }
        
        /* 增加可點擊區域的手勢提示 */
        .beer-item .star-btn { color: #444; font-size: 18px; text-align: center; cursor: pointer; }
        .beer-item .star-btn.favored { color: var(--accent-color); }
        .beer-item .no { color: var(--accent-color); font-weight: bold; text-align: center; cursor: pointer; }
        .beer-item .zh { font-weight: 500; }
        .beer-item .en { color: var(--text-muted); font-style: italic; }
        
        .beer-item.playing { background-color: var(--highlight-bg); border-left: 4px solid var(--accent-color); font-weight: bold; }
        
        /* 盲聽模式遮罩 */
        .quiz-mode .beer-item .zh:not(.revealed) { color: transparent; background: #444; border-radius: 4px; cursor: pointer; }
        .quiz-mode .beer-item .en:not(.revealed) { color: transparent; background: #444; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🍻 精釀啤酒專業考核系統</h1>
    </header>
    
    <div class="filter-panel">
        <button class="tab-btn active" id="tab1" onclick="switchGroup(1)">第一組 (01-50)</button>
        <button class="tab-btn" id="tab2" onclick="switchGroup(2)">第二組 (51-100)</button>
        <button class="fav-filter-btn" id="favFilterBtn" onclick="toggleFavFilter()">🔍 ⭐</button>
    </div>

    <div class="control-panel">
        <div class="panel-row">
            <div class="btn-group">
                <button id="playBtn" class="action-btn go">▶ 播放語音</button>
                <button id="pauseBtn" class="action-btn">⏸ 暫停</button>
                <button id="stopBtn" class="action-btn primary">⏹ 變更 / 重置</button>
            </div>
        </div>

        <div class="slider-group">
            <div class="slider-row">
                <span>🗣️ 語速控制: <span id="rateVal">0.9</span>x</span>
                <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.05" value="0.9" oninput="document.getElementById('rateVal').innerText=this.value">
            </div>
            <div class="slider-row">
                <span>⏱️ 每首間隔: <span id="delayVal">1.5</span> 秒</span>
                <input type="range" id="delaySlider" min="0.5" max="4.0" step="0.5" value="1.5" oninput="document.getElementById('delayVal').innerText=this.value">
            </div>
        </div>

        <div class="settings-group">
            <label><input type="checkbox" id="loopCheck" checked> 🔁 循環播放</label>
            <label><input type="checkbox" id="shuffleCheck" onchange="handleShuffleToggle()"> 🔀 隨機亂序</label>
            <label style="color: var(--accent-color); font-weight: bold;"><input type="checkbox" id="quizCheck" onchange="handleQuizToggle()"> 🎯 盲聽測驗模式</label>
        </div>
    </div>
    
    <div class="beer-list" id="listContainer"></div>
</div>

<script>
    const group1 = [
        {no:1, zh:"艾比酒", en:"Abbey Ale"},{no:2, zh:"老啤酒", en:"Altbier"},{no:3, zh:"琥珀愛爾", en:"Amber Ale"},{no:4, zh:"美式IPA", en:"American IPA"},{no:5, zh:"美式淡愛爾", en:"American Pale Ale"},
        {no:6, zh:"美式皮爾森", en:"American Pilsner"},{no:7, zh:"美式斯陶特", en:"American Stout"},{no:8, zh:"波羅地海波特", en:"Baltic Porter"},{no:9, zh:"大麥酒", en:"Barley Wine"},{no:10, zh:"桶陳", en:"Barrel Aged"},
        {no:11, zh:"比利時IPA", en:"Belgian IPA"},{no:12, zh:"比利時淡愛爾", en:"Belgian Pale Ale"},{no:13, zh:"比利時強黑愛爾", en:"Belgian Strong Dark"},{no:14, zh:"比利時強金愛爾", en:"Belgian Strong Gold"},{no:15, zh:"柏林小麥", en:"Berliner Weisse"},
        {no:16, zh:"最佳苦啤酒", en:"Best Bitter"},{no:17, zh:"蒸餾啤酒", en:"Bierbrand"},{no:18, zh:"苦啤酒", en:"Bitter"},{no:19, zh:"黑色IPA", en:"Black IPA"},{no:20, zh:"比利時黃金", en:"Blond"},
        {no:21, zh:"勃克", en:"Bock"},{no:22, zh:"棕愛爾", en:"Brown Ale"},{no:23, zh:"香檳IPA", en:"Brut IPA"},{no:24, zh:"布頓愛爾", en:"Burton Ale"},{no:25, zh:"加州一般型", en:"California Common"},
        {no:26, zh:"木桶愛爾", en:"Cask Ale"},{no:27, zh:"巧克力斯陶特", en:"Chocolate Stout"},{no:28, zh:"西打酒", en:"Cider"},{no:29, zh:"咖啡斯陶特", en:"Coffee Stout"},{no:30, zh:"奶油愛爾", en:"Cream Ale"},
        {no:31, zh:"捷克皮爾森", en:"Czech Pilsner"},{no:32, zh:"雙倍勃克", en:"Doppelbock"},{no:33, zh:"多特蒙德出口型拉格", en:"Dortmunder Export"},{no:34, zh:"雙倍IPA", en:"Double IPA"},{no:35, zh:"比利時雙倍", en:"Dubbel"},
        {no:36, zh:"黑拉格", en:"Dunkel"},{no:37, zh:"黑小麥", en:"Dunkelweizen"},{no:38, zh:"冰勃克", en:"Eisbock"},{no:39, zh:"特殊苦啤酒", en:"Extra Special Bitter"},{no:40, zh:"農舍愛爾", en:"Farmhouse Ale"},
        {no:41, zh:"黑糖蘭比克", en:"Faro"},{no:42, zh:"法蘭德斯紅愛爾", en:"Flanders Red Ale"},{no:43, zh:"法蘭德斯棕愛爾", en:"Flemish Oud Bruin"},{no:44, zh:"水果愛爾", en:"Fruit Ale"},{no:45, zh:"水果蘭比克", en:"Fruit Lambic"},
        {no:46, zh:"水果白啤酒", en:"Fruit Witbier"},{no:47, zh:"德式皮爾森", en:"German Pilsner"},{no:48, zh:"無麩質啤酒", en:"Gluten Free"},{no:49, zh:"英式金愛爾", en:"Golden Ale"},{no:50, zh:"鹽小麥", en:"Gose"}
    ];
    const group2 = [
        {no:51, zh:"古魯特", en:"Gruit"},{no:52, zh:"香檳啤酒", en:"Gueuze"},{no:53, zh:"酵母小麥", en:"Hefeweizen"},{no:54, zh:"帝國IPA", en:"Imperial IPA"},{no:55, zh:"帝國斯陶特", en:"Imperial Stout"},
        {no:56, zh:"印度式淡愛爾", en:"India Pale Ale"},{no:57, zh:"印度式淡拉格", en:"IPL"},{no:58, zh:"愛爾蘭紅愛爾", en:"Irish Red Ale"},{no:59, zh:"愛爾蘭斯陶特", en:"Irish Stout"},{no:60, zh:"原漿啤酒", en:"Kellerbier"},
        {no:61, zh:"科隆", en:"Kolsch"},{no:62, zh:"比利時櫻桃啤酒", en:"Kriek"},{no:63, zh:"水晶小麥", en:"Kristallweizen"},{no:64, zh:"蘭比克", en:"Lambic"},{no:65, zh:"五月勃克", en:"Maibock"},
        {no:66, zh:"梅爾森", en:"Marzen"},{no:67, zh:"輕愛爾", en:"Mild"},{no:68, zh:"牛奶斯陶特", en:"Milk Stout"},{no:69, zh:"慕尼黑淡拉格", en:"Munich Helles"},{no:70, zh:"新英格蘭IPA", en:"NE IPA"},
        {no:71, zh:"無酒精啤酒", en:"Non-alcohol"},{no:72, zh:"燕麥斯陶特", en:"Oatmeal Stout"},{no:73, zh:"十月啤酒", en:"Oktoberfestbier"},{no:74, zh:"老愛爾", en:"Old Ale"},{no:75, zh:"牡蠣斯陶特", en:"Oyster Stout"},
        {no:76, zh:"南太平洋淡愛爾", en:"Pacific Pale Ale"},{no:77, zh:"梨子西打酒", en:"Perry"},{no:78, zh:"皮爾森", en:"Pilsner"},{no:79, zh:"波特", en:"Porter"},{no:80, zh:"頂級苦啤酒", en:"Premium Bitter"},
        {no:81, zh:"南瓜愛爾", en:"Pumpkin Ale"},{no:82, zh:"比利時四倍", en:"Quadrupel"},{no:83, zh:"蘇打啤酒", en:"Radler"},{no:84, zh:"煙燻啤酒", en:"Rauchbier"},{no:85, zh:"紅色IPA", en:"Red IPA"},
        {no:86, zh:"裸麥愛爾", en:"Rye Ale"},{no:87, zh:"季節啤酒", en:"Saison"},{no:88, zh:"深黑拉格", en:"Schwarzbier"},{no:89, zh:"蘇格蘭愛爾", en:"Scotch Ale"},{no:90, zh:"社交IPA", en:"Session IPA"},
        {no:91, zh:"酸愛爾", en:"Sour Ale"},{no:92, zh:"蒸氣啤酒", en:"Steam Beer"},{no:93, zh:"修道院", en:"Trappist"},{no:94, zh:"比利時雙倍", en:"Tripel"},{no:95, zh:"維也納", en:"Vienna"},
        {no:96, zh:"小麥勃克", en:"Weizenbock"},{no:97, zh:"小麥愛爾", en:"Wheat Ale"},{no:98, zh:"白色IPA", en:"White IPA"},{no:99, zh:"冬季啤酒", en:"Winter Warmer"},{no:100, zh:"白啤酒", en:"Witbier"}
    ];

    let currentGroupNum = 1;
    let favorites = JSON.parse(localStorage.getItem('beer_favs')) || [];
    let showFavOnly = false;
    let displayList = []; let playOrder = []; let playPointer = 0;
    let isPlaying = false; let synth = window.speechSynthesis; let delayTimeout = null;

    function prepareData() {
        let raw = currentGroupNum === 1 ? group1 : group2;
        displayList = showFavOnly ? raw.filter(item => favorites.includes(item.no)) : [...raw];
        playOrder = displayList.map((_, i) => i);
        if (document.getElementById('shuffleCheck').checked) {
            playOrder.sort(() => Math.random() - 0.5);
        }
    }

    function renderList() {
        prepareData();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        if(displayList.length === 0) { container.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">暫無收藏項目</div>'; return; }
        
        displayList.forEach((beer, idx) => {
            const isFav = favorites.includes(beer.no);
            const item = document.createElement('div');
            item.className = 'beer-item';
            item.id = `beer-${idx}`;
            item.innerHTML = `
                <div class="star-btn ${isFav ? 'favored' : ''}" onclick="toggleFav(event, ${beer.no})">★</div>
                <div class="no" onclick="handleItemTrigger(${idx})">${String(beer.no).padStart(2,'0')}</div>
                <div class="zh" id="zh-${idx}" onclick="handleLabelClick(event, ${idx})">${beer.zh}</div>
                <div class="en" id="en-${idx}" onclick="handleLabelClick(event, ${idx})">${beer.en}</div>
            `;
            
            // 點擊整列背景時，排除星號和文字區塊，觸發播放
            item.addEventListener('click', (e) => {
                if (e.target.classList.contains('star-btn') || e.target.classList.contains('zh') || e.target.classList.contains('en') || e.target.classList.contains('no')) return;
                handleItemTrigger(idx);
            });
            
            container.appendChild(item);
        });
        handleQuizToggle();
    }

    // 處理手動點擊品名：如果是盲聽模式，單純切換顯示/隱藏答案，絕不干擾或重播語音
    function handleLabelClick(e, idx) {
        e.stopPropagation();
        if (document.getElementById('quizCheck').checked) {
            document.getElementById(`zh-${idx}`).classList.toggle('revealed');
            document.getElementById(`en-${idx}`).classList.toggle('revealed');
        } else {
            handleItemTrigger(idx);
        }
    }

    // 處理點選編號或列觸發語音播放
    function handleItemTrigger(idx) {
        playPointer = playOrder.indexOf(idx);
        startPlayback();
    }

    function toggleFav(e, no) { e.stopPropagation(); favorites = favorites.includes(no) ? favorites.filter(n=>n!==no) : [...favorites, no]; localStorage.setItem('beer_favs', JSON.stringify(favorites)); renderList(); }
    function switchGroup(num) { currentGroupNum = num; document.getElementById('tab1').classList.toggle('active',num===1); document.getElementById('tab2').classList.toggle('active',num===2); stopPlayback(); renderList(); }
    function toggleFavFilter() { showFavOnly = !showFavOnly; document.getElementById('favFilterBtn').classList.toggle('active',showFavOnly); stopPlayback(); renderList(); }
    function handleShuffleToggle() { if(!isPlaying) { prepareData(); } }
    function handleQuizToggle() { 
        document.getElementById('listContainer').classList.toggle('quiz-mode', document.getElementById('quizCheck').checked); 
        if(!document.getElementById('quizCheck').checked) {
            document.querySelectorAll('.zh, .en').forEach(el => el.classList.remove('revealed'));
        }
    }

    function startPlayback() {
        if(displayList.length === 0) return;
        isPlaying = true;
        synth.cancel();
        clearTimeout(delayTimeout);
        speak();
    }

    function pausePlayback() {
        isPlaying = false;
        clearTimeout(delayTimeout);
        synth.cancel();
    }

    function stopPlayback() {
        isPlaying = false;
        playPointer = 0;
        clearTimeout(delayTimeout);
        synth.cancel();
        document.querySelectorAll('.beer-item').forEach(el=>el.classList.remove('playing'));
    }

    function speak() {
        if(!isPlaying) return;
        if(playPointer >= playOrder.length) { 
            if(document.getElementById('loopCheck').checked) { playPointer = 0; } 
            else { stopPlayback(); return; } 
        }
        
        const idx = playOrder[playPointer];
        const beer = displayList[idx];
        
        document.querySelectorAll('.beer-item').forEach(el=>el.classList.remove('playing'));
        
        const container = document.getElementById('listContainer');
        const activeRow = document.getElementById(`beer-${idx}`);
        
        // 【5次校對核心】完美計算內部滾動，確保當前行老老實實出現在清單的正中央，絕不拉扯外層網頁
        if(activeRow) {
            activeRow.classList.add('playing');
            const targetTop = activeRow.offsetTop - (container.clientHeight / 2) + (activeRow.clientHeight / 2);
            container.scrollTo({ top: targetTop, behavior: 'smooth' });
        }

        const isQuizMode = document.getElementById('quizCheck').checked;
        const currentSpeed = parseFloat(document.getElementById('rateSlider').value);
        const nextSongDelay = parseFloat(document.getElementById('delaySlider').value) * 1000;

        if (isQuizMode) {
            // 🎯 盲聽模式精簡邏輯：
            // 英文1 -> 英文2 -> 絕不發出中文答案語音 -> 直接安靜等待 Delay -> 自動跳下一首
            let eq1 = new SpeechSynthesisUtterance(beer.en); eq1.lang = 'en-US'; eq1.rate = currentSpeed;
            let eq2 = new SpeechSynthesisUtterance(beer.en); eq2.lang = 'en-US'; eq2.rate = currentSpeed;
            
            eq1.onend = () => { if(isPlaying) setTimeout(() => { if(isPlaying) synth.speak(eq2); }, 100); };
            eq2.onend = () => { 
                if(isPlaying) { 
                    playPointer++; 
                    delayTimeout = setTimeout(speak, nextSongDelay); 
                } 
            };
            synth.speak(eq1);
        } else {
            // 👥 一般標準模式：
            // 中文1 -> 英文1 -> 英文2 -> 等待 Delay -> 自動下一首
            let uZh = new SpeechSynthesisUtterance(beer.zh); uZh.lang = 'zh-TW'; uZh.rate = currentSpeed;
            let uEn1 = new SpeechSynthesisUtterance(beer.en); uEn1.lang = 'en-US'; uEn1.rate = currentSpeed;
            let uEn2 = new SpeechSynthesisUtterance(beer.en); uEn2.lang = 'en-US'; uEn2.rate = currentSpeed;
            
            uZh.onend = () => { if(isPlaying) setTimeout(() => { if(isPlaying) synth.speak(uEn1); }, 100); };
            uEn1.onend = () => { if(isPlaying) setTimeout(() => { if(isPlaying) synth.speak(uEn2); }, 100); };
            uEn2.onend = () => { if(isPlaying) { playPointer++; delayTimeout = setTimeout(speak, nextSongDelay); } };
            synth.speak(uZh);
        }
    }

    document.getElementById('playBtn').addEventListener('click', startPlayback);
    document.getElementById('pauseBtn').addEventListener('click', pausePlayback);
    document.getElementById('stopBtn').addEventListener('click', stopPlayback);
    window.addEventListener('DOMContentLoaded', renderList);
</script>
</body>
</html>
